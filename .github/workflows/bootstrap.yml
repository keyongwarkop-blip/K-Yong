name: Bootstrap KYong Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create . \
            --project-name kyong \
            --org com.kyong \
            --platforms=android

      - name: Check Flutter project
        run: |
          flutter pub get
          flutter analyze

      - name: Commit generated project
        run: |
          git config user.name "KYong Builder"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: bootstrap KYong Android project"
            git push
          fi
